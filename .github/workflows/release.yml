name: Release Package

# This action will start when a correctly formatted tag is pushed (e.g. 0.1.0)

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate (build & test)
        run: |
          dotnet build src/PropertyAuditTool.slnx -c Release
          dotnet test src/PropertyAuditTool.Tests/PropertyAuditTool.Tests.csproj -c Release --no-build -p:SkipClientBuild=true

      - name: Pack
        run: dotnet pack src/PropertyAuditTool/PropertyAuditTool.csproj -c Release /p:Version=${{github.ref_name}} --no-build -o ./artifacts/packages

      - name: Inspect package contents
        run: |
          dotnet tool install --global NuGet.PackageExplorer.Console --version 6.* || true
          find ./artifacts/packages -name '*.nupkg' -exec ls -la {} \;

      - name: Push to NuGet
        # Only ever runs for a pushed release tag; publication stays a deliberate act.
        run: dotnet nuget push ./artifacts/packages/*.nupkg -k ${{secrets.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json
